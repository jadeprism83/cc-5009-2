[package]
name = "museum-lighting"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.21", features = ["derive"] }
egui = "0.32.0"
egui-wgpu = "0.32.0"
egui-winit = { version = "0.32.0", default-features = false }
env_logger = "0.11"
glam = { version = "0.30", features = ["bytemuck"] }
half = "2.4"
image = { version = "0.25", default-features = false, features = ["hdr", "png"] }
log = "0.4"
pollster = "0.4"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
thiserror = "2.0"
wgpu = "25.0"
winit = "0.30"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4

[profile.test]
opt-level = 2
